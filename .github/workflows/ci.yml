name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm ci
          python -m pip install --quiet sympy

      - name: Typecheck and unit tests (content, KaTeX strict rendering, scoring, drills, line breaking)
        run: npm run check

      - name: Verify every answer by computer algebra and an independent method
        run: npm run verify:answers

      - name: Build the single-file site
        run: npx vite build
